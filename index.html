<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22483A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="開展隊">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>開展隊記錄彙整代禱平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" as="script" href="https://static.line-scdn.net/liff/edge/2/sdk.js">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<style>
  :root {
    /* 平台配色：福音綠＋米白紙＋金（沿用 IN CHRIST 的米白與金，主色改為開展的綠） */
    --sky: #F7F4EC;        /* 頁面底色（暖米白） */
    --sky-2: #ECE7DA;      /* 次要底色 */
    --paper: #FFFDF8;      /* 卡片紙 */
    --ink: #22302A;        /* 主要文字（深墨綠） */
    --ink-2: #66675F;      /* 次要文字 */
    --rule: #E2DCCB;       /* 分隔、邊框 */
    --marigold: #C49356;   /* 金色點綴 */
    --gold-text: #8A6431;  /* 米白底上的金色文字 */
    --gold-soft: rgba(196, 147, 86, .16);
    --line: #2C5B47;       /* 主要動作按鈕（福音綠） */
    --line-dark: #1C3F31;
    --chrome: #22483A;     /* 頁首橫幅 */
    --chrome-fg: #F7F1E4;
    --chrome-muted: #C3CBBF;
    --stamp: #B03A2E;      /* 迫切、刪除（磚紅） */
    --shadow: 0 1px 2px rgba(40, 50, 30, .05), 0 8px 24px rgba(40, 50, 30, .08);
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: -apple-system, "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }

  #app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  /* ---------- 頂部 ---------- */
  header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 -16px; padding: calc(22px + env(safe-area-inset-top)) 16px 18px; background: var(--chrome); color: var(--chrome-fg); border-bottom: 3px solid var(--marigold); }
  header.top .brand { display: flex; align-items: center; gap: 12px; }
  header.top .logo { width: 44px; height: 44px; flex: none; }
  header.top h1 { font-family: var(--serif); font-weight: 900; font-size: 24px; letter-spacing: .06em; margin: 0; color: var(--chrome-fg); }
  header.top .who { color: var(--chrome-muted); font-size: 14px; white-space: nowrap; }
  .demo-note { background: var(--gold-soft); color: var(--gold-text); font-size: 13px; padding: 8px 12px; border-radius: 8px; margin: 8px 0 4px; }

  .tabs { display: flex; gap: 22px; border-bottom: 2px solid var(--rule); margin: 14px 0 20px; }
  .tabs button { background: none; border: 0; padding: 10px 0; font-size: 16px; font-weight: 500; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--marigold); font-weight: 700; }
  .tabs .n { font-size: 13px; color: var(--ink-2); margin-left: 4px; }

  .subbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 14px; }
  .back { background: none; border: 0; padding: 6px 0; font-size: 16px; color: var(--ink-2); cursor: pointer; }
  .subbar h1 { font-size: 17px; margin: 0; }

  /* ---------- 票券（圖卡預覽） ---------- */
  .ticket { position: relative; background: var(--paper); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); border-top: 6px solid var(--line); } /* 上方色帶＝活動色調 */
  .ticket .hero { width: 100%; aspect-ratio: 20 / 13; object-fit: cover; display: block; background: var(--rule); }
  .ticket .main { padding: 20px 22px 18px; }
  .ticket .title { font-family: var(--serif); font-weight: 900; font-size: 24px; line-height: 1.35; margin: 0 0 12px; word-break: break-word; }
  .ticket .title.empty { color: var(--rule); }
  .ticket dl { display: grid; grid-template-columns: 3em 1fr; gap: 4px 10px; margin: 0; font-size: 15px; }
  .ticket dt { color: var(--ink-2); }
  .ticket dd { margin: 0; word-break: break-word; }
  .ticket .desc { color: var(--ink-2); font-size: 14px; margin: 12px 0 0; white-space: pre-wrap; word-break: break-word; }
  .ticket .perf { position: relative; height: 0; border-top: 2px dashed var(--rule); margin: 0 18px; }
  .ticket .perf::before, .ticket .perf::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--sky); }
  .ticket .perf::before { left: -31px; }
  .ticket .perf::after { right: -31px; }
  .ticket .stub { padding: 16px 22px 20px; display: flex; align-items: center; gap: 14px; }
  .ticket .stub .notch { width: 8px; align-self: stretch; background: var(--marigold); border-radius: 4px; }
  .ticket .stub .fake-btn { flex: 1; background: var(--line); color: var(--chrome-fg); text-align: center; font-weight: 700; padding: 11px; border-radius: 10px; }
  .ticket .tally { display: flex; align-items: baseline; gap: 6px; }
  .ticket .tally b { font-family: var(--serif); font-size: 34px; line-height: 1; }
  .ticket .tally span { color: var(--ink-2); font-size: 14px; }
  .ticket .tally .state { margin-left: auto; }

  .pv-panel { --sky: var(--sky-2); background: var(--sky-2); border: 1.5px dashed var(--marigold); border-radius: 20px; padding: 12px 14px 18px; }
  .pv-label { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 12px; flex-wrap: wrap; }
  .pv-label .tag { background: var(--marigold); color: var(--paper); font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; letter-spacing: .06em; }
  .pv-label small { color: var(--ink-2); font-size: 13px; }
  .form-title { font-family: var(--serif); font-weight: 900; font-size: 20px; margin: 30px 0 14px; padding-bottom: 8px; border-bottom: 1.5px solid var(--rule); }
  .caption { color: var(--ink-2); font-size: 13px; text-align: center; margin: 10px 0 26px; }

  /* ---------- 表單 ---------- */
  .group { margin: 0 0 22px; }
  .group h2 { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
  .field { display: block; margin-bottom: 10px; }
  .field > span { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 50px; }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
  .field .help { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 > .field { min-width: 0; }

  .img-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .img-pick .btn.small { margin: 0; }
  .q-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .q-row input { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 11px 14px; font-size: 16px; }
  .q-row input:focus { outline: none; border-color: var(--ink); }
  .q-del { width: 46px; flex: none; border: 1.5px solid var(--rule); background: var(--paper); border-radius: 12px; font-size: 20px; color: var(--ink-2); cursor: pointer; }
  .q-card { background: var(--paper); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .q-card .q-row { margin-bottom: 8px; }
  .q-card .q-row input { background: var(--sky-2); border-color: transparent; }
  .q-type { display: inline-flex; border: 1.5px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .q-type button { border: 0; background: transparent; padding: 6px 14px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
  .q-type button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
  .q-opts { width: 100%; margin-top: 8px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 11px 14px; font-size: 16px; }
  .q-opts:focus { outline: none; border-color: var(--ink); }
  .field select { width: 100%; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 50px; color: var(--ink); appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
  .stat-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .stat-head .btn.small { margin: 0; flex: none; }
  .empty-note { border-top: 1px solid var(--sky); padding-top: 10px; margin-top: 4px; }
  .group-block { border-top: 1px solid var(--sky); padding: 12px 0 6px; }
  .group-block:first-of-type { margin-top: 8px; }
  .group-block .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .group-block .lbl { font-weight: 700; font-size: 16px; }
  .group-block .cnt { color: var(--ink-2); font-size: 13px; }
  .group-block.none .lbl { color: var(--ink-2); }
  .group-block.none .bar i { background: var(--rule); }
  .names { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5em, 1fr)); gap: 6px; }
  .stat .names li { background: var(--sky-2); border: 0; border-radius: 8px; padding: 5px 10px; font-size: 14px; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px dashed var(--ink-2); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .chip.new { border-style: solid; border-color: var(--ink); font-weight: 700; }

  /* ---------- 底部固定按鈕 ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--sky) 70%, rgba(250,246,238,0)); z-index: 5; }
  .dock .inner { max-width: 480px; margin: 0 auto; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.send { background: var(--line); color: var(--chrome-fg); box-shadow: 0 6px 16px -8px var(--line-dark); }
  .btn.send:active { background: var(--line-dark); }
  .btn.ink { background: var(--ink); color: var(--chrome-fg); }
  .btn.plain { background: var(--paper); color: var(--ink); border: 1.5px solid var(--rule); }
  .btn.cancel { background: transparent; color: var(--stamp); border: 1.5px solid rgba(176, 58, 46, .35); }
  .btn.cancel.armed { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .btn.small { display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

  /* ---------- 狀態標籤 ---------- */
  .state { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--gold-soft); color: var(--gold-text); white-space: nowrap; }
  .state.full { background: rgba(176, 58, 46, .10); color: var(--stamp); }
  .state.ended, .state.closed { background: var(--sky-2); color: var(--ink-2); }

  /* ---------- 已發布列表 ---------- */
  .stubs { display: grid; gap: 12px; }
  .templates { margin: 0 0 20px; }
  .templates h2 { font-size: 15px; margin: 0 0 10px; }
  .tpl-row { display: flex; gap: 12px; overflow-x: auto; padding: 8px 2px 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-snap-type: x mandatory; }
  .tpl { flex: none; width: 150px; text-align: left; background: var(--paper); border: 1.5px solid var(--rule); border-left: 6px solid var(--tc); border-radius: 12px; padding: 10px 12px; cursor: pointer; scroll-snap-align: start; }
  .tpl b { display: block; font-size: 15px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tpl small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tpl:active { border-color: var(--ink); }
  .templates .help { margin: 4px 0 0; font-size: 12px; color: var(--ink-2); }
  .tone-pick { margin-top: 16px; padding-top: 14px; border-top: 1.5px dashed var(--marigold); }
  .tone-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .tone-head h3 { margin: 0; font-size: 15px; }
  .tone-head .btn.small { margin: 0; }
  .tones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tones button { border: 1.5px solid var(--rule); background: var(--paper); border-radius: 12px; padding: 9px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .tones i { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--sw) 0 58%, var(--sw2) 58%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }
  .tones button[aria-checked="true"] { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); font-weight: 700; }
  .cleanup { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--gold-soft); border: 1.5px solid var(--marigold); border-radius: 14px; padding: 12px 14px; margin: -4px 0 16px; }
  .cleanup p { margin: 0; font-size: 14px; line-height: 1.5; }
  .cleanup p span { color: var(--ink-2); font-size: 13px; }
  .cleanup .btn.small { margin: 0; flex: none; }
  .stub-card.past { filter: grayscale(1); opacity: .62; background: var(--sky-2); }
  .stub-card.past[aria-checked="true"] { opacity: .9; }
  .state.over { background: var(--ink-2); color: var(--paper); }
  .tpl-wrap { position: relative; flex: none; scroll-snap-align: start; }
  .tpl small.saved { color: var(--gold-text); }
  .tpl-x { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink-2); font-size: 14px; line-height: 1; padding: 0 6px; cursor: pointer; }
  .tpl-x.armed { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin: -6px 0 12px; color: var(--ink-2); font-size: 14px; }
  .list-acts { display: flex; gap: 8px; }
  .list-acts .btn.small { margin: 0; }
  .stubs.selecting .stub-card .info { position: relative; padding-left: 50px; }
  .stub-card .check { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--rule); background: var(--paper); }
  .stub-card[aria-checked="true"] { box-shadow: 0 0 0 2px var(--stamp); }
  .stub-card[aria-checked="true"] .check { background: var(--stamp); border-color: var(--stamp); }
  .stub-card[aria-checked="true"] .check::after { content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .btn.danger-fill { background: var(--stamp); color: #fff; }
  .btn.danger-fill.armed { background: #8E2A20; }
  .btn.danger-fill:disabled { background: var(--rule); color: var(--ink-2); opacity: 1; }
  .stub-card { background: var(--paper); border-radius: 14px; display: grid; grid-template-columns: 1fr auto; overflow: hidden; border: 0; padding: 0; text-align: left; width: 100%; cursor: pointer; }
  .stub-card .info { padding: 14px 16px; min-width: 0; }
  .stub-card .t { font-family: var(--serif); font-weight: 900; font-size: 17px; line-height: 1.4; word-break: break-word; }
  .stub-card .d { color: var(--ink-2); font-size: 13px; margin: 2px 0 6px; }
  .stub-card .count { border-left: 2px dashed var(--rule); padding: 14px 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 84px; }
  .stub-card .count b { font-family: var(--serif); font-size: 30px; line-height: 1; }
  .stub-card .count small { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .empty { text-align: center; color: var(--ink-2); padding: 40px 10px; }
  .empty .btn { margin-top: 14px; }

  /* ---------- 活動詳情 ---------- */
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 6px; }
  .fact { background: var(--paper); border-radius: 12px; padding: 10px 14px; }
  .fact small { display: block; color: var(--ink-2); font-size: 12px; }
  .fact span { font-weight: 700; }
  .roll-head { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 8px; }
  .roll-head h2 { font-size: 17px; margin: 0; }
  .roll { list-style: none; margin: 0; padding: 0; background: var(--paper); border-radius: 14px; overflow: hidden; counter-reset: roll; }
  .roll li { display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; align-items: baseline; padding: 11px 16px; border-top: 1px solid var(--sky); counter-increment: roll; }
  .roll li:first-child { border-top: 0; }
  .roll li::before { content: counter(roll); font-family: var(--serif); font-weight: 900; color: var(--ink-2); }
  .roll .nm { font-weight: 500; min-width: 0; word-break: break-word; }
  .roll .nm small { display: block; color: var(--ink-2); font-size: 12px; font-weight: 400; }
  .roll time { color: var(--ink-2); font-size: 13px; }
  .roll .nm small.ans { color: var(--ink); font-size: 14px; margin-top: 2px; }
  .stats { display: grid; gap: 12px; }
  .stat { background: var(--paper); border-radius: 14px; padding: 14px 16px; }
  .stat h3 { font-size: 16px; margin: 0; }
  .stat .meta { color: var(--ink-2); font-size: 13px; margin: 2px 0 0; }
  .stat .sum { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 0; }
  .stat .sum b { font-family: var(--serif); font-size: 34px; line-height: 1; }
  .stat .sum span { color: var(--ink-2); font-size: 14px; }
  .stat ul { list-style: none; margin: 10px 0 0; padding: 0; }
  .stat li { padding: 9px 0; border-top: 1px solid var(--sky); }
  .stat li:first-child { border-top: 0; }
  .stat li .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .stat .lbl { font-weight: 700; word-break: break-word; }
  .stat .cnt { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .stat .cnt.dup { color: var(--stamp); font-weight: 700; }
  .stat .bar { height: 8px; background: var(--sky-2); border-radius: 4px; margin: 6px 0 4px; overflow: hidden; }
  .stat .bar i { display: block; height: 100%; background: var(--marigold); border-radius: 4px; }
  .stat .who { color: var(--ink-2); font-size: 13px; word-break: break-word; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 12px; overflow-x: auto; }
  .chart .col { flex: 1; min-width: 28px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .chart .track { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-height: 0; }
  .chart .col i { width: 100%; max-width: 36px; background: var(--marigold); border-radius: 6px 6px 2px 2px; }
  .chart .n { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .chart .d { font-size: 11px; color: var(--ink-2); margin-top: 5px; white-space: nowrap; }

  /* ---------- 成員 ---------- */
  .add-member { background: var(--paper); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .add-member h2 { font-size: 15px; margin: 0 0 10px; }
  .add-member .btn { margin-top: 4px; }
  .summary { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
  .search { width: 100%; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 11px 14px; font-size: 16px; margin-bottom: 12px; }
  .members { list-style: none; margin: 0; padding: 0; background: var(--paper); border-radius: 14px; overflow: hidden; }
  .members li { padding: 12px 16px; border-top: 1px solid var(--sky); }
  .members li:first-child { border-top: 0; }
  .members .line1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .members .nm { font-weight: 700; }
  .members .ph { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
  .members .line2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
  .members .acts { display: flex; gap: 6px; }
  .members .acts button { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .members .acts button.danger { color: var(--stamp); border-color: rgba(176, 58, 46, .35); }
  .members .acts button.armed { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .bound { color: var(--gold-text); font-weight: 500; }

  /* ---------- 成員登記畫面 ---------- */
  .solo { padding-top: 40px; }
  .solo .ticket { overflow: visible; }
  .solo .ticket .main { padding-top: 26px; }
  .result-msg { padding: 18px 22px 22px; }
  .result-msg p { margin: 0; }
  .result-msg .muted { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .stamp { position: absolute; right: 18px; top: 18px; width: 96px; height: 96px; border: 4px solid var(--stamp); border-radius: 50%; color: var(--stamp); display: grid; place-items: center; font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: .08em; transform: rotate(-14deg); opacity: .9; background: rgba(255,253,248,.7); }
  .stamp::before { content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--stamp); border-radius: 50%; }
  .stamp.ink { border-color: var(--ink-2); color: var(--ink-2); }
  .stamp.ink::before { border-color: var(--ink-2); }
  .stamp.land { animation: land .42s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes land { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .9; } }
  .solo .ticket .title { padding-right: 100px; }
  .install { text-align: center; padding-top: 56px; }
  .install .app-icon { border-radius: 22px; box-shadow: var(--shadow); }
  .install h1 { font-family: var(--serif); font-weight: 900; font-size: 26px; margin: 14px 0 4px; }
  .install .btn { margin-top: 18px; }
  .install-steps { text-align: left; background: var(--paper); border-radius: 14px; padding: 14px 18px 14px 38px; margin: 18px 0 0; line-height: 1.9; box-shadow: var(--shadow); }
  .install .small { font-size: 13px; margin-top: 14px; }
  .page-foot { display: flex; justify-content: center; gap: 18px; }
  .page-foot .mydata-link { display: inline-block; }
  .mydata-link { display: block; text-align: center; margin: 22px auto 0; font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
  .page-foot { padding: 10px 0 0; }
  dl.mydata { display: grid; grid-template-columns: 3.5em 1fr; gap: 6px 10px; margin: 0; }
  dl.mydata dt { color: var(--ink-2); }
  dl.mydata dd { margin: 0; word-break: break-all; }
  .mydata-list { list-style: none; margin: 6px 0 0; padding: 0; }
  .mydata-list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
  .mydata-list time { color: var(--ink-2); white-space: nowrap; }
  .stamp + .main dl { margin-right: 96px; } /* 沒有圖片時，印章會落在內文上 */
  .warn { background: #FBECEC; color: #8E1F27; font-size: 14px; padding: 10px 12px; border-radius: 10px; margin: 0 0 12px; }
  .posted { margin-top: 10px; font-size: 13px; color: var(--gold-text); }

  .loading { text-align: center; color: var(--ink-2); padding: 80px 0; }
  .loading .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--marigold); margin: 0 4px; animation: blink 1s infinite; }
  .loading .dot:nth-child(2) { animation-delay: .15s; } .loading .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  code.uid { display: block; word-break: break-all; background: var(--sky); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 12px 0; }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--chrome-fg); padding: 11px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 頁首的教學按鈕 ---------- */
  header.top { align-items: center; }
  header.top .help { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid var(--marigold); background: transparent; color: var(--marigold); font-family: var(--serif); font-weight: 900; font-size: 18px; cursor: pointer; }

  /* ---------- 使用教學：變暗＋金框圈出功能＋說明泡泡（樣式取自聖經網站） ---------- */
  .tour { position: fixed; inset: 0; z-index: 1000; opacity: 0; transition: opacity .22s; }
  .tour.on { opacity: 1; }
  .tour-catch { position: absolute; inset: 0; touch-action: none; }
  .tour-hole { position: absolute; left: 0; top: 0; border-radius: 14px; pointer-events: none;
    box-shadow: 0 0 0 2px var(--chrome), 0 0 0 5px var(--marigold), 0 0 0 200vmax rgba(16, 18, 28, .72);
    transition: transform .32s cubic-bezier(.2,.8,.2,1), width .32s cubic-bezier(.2,.8,.2,1), height .32s cubic-bezier(.2,.8,.2,1); }
  .tour-bubble { position: absolute; left: 0; top: 0; width: min(320px, calc(100vw - 24px)); background: var(--chrome); color: var(--chrome-fg);
    border: 1px solid var(--marigold); border-radius: 16px; padding: 14px 16px 12px; box-shadow: 0 12px 36px rgba(0,0,0,.35); font-size: 15px; line-height: 1.6;
    transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  .tour-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .tour-head h2 { margin: 0; font: 900 17px/1.4 var(--serif); color: #D9A466; letter-spacing: .04em; }
  .tour-count { flex: none; font-size: 12px; font-weight: 700; color: var(--chrome-muted); font-variant-numeric: tabular-nums; }
  .tour-bubble p { margin: 6px 0 12px; }
  .tour-btns { display: flex; align-items: center; gap: 6px; }
  .tour-btns button { min-height: 40px; padding: 0 12px; border: 0; border-radius: 99px; background: transparent; font-size: 15px; color: var(--chrome-fg); cursor: pointer; }
  .tour-btns .tour-skip { color: var(--chrome-muted); padding-left: 4px; margin-right: auto; }
  .tour-btns .tour-next { background: var(--marigold); color: var(--chrome); font-weight: 700; padding: 0 18px; }
  .tour-btns button:disabled { opacity: .4; cursor: default; }
  .tour-btns button:focus-visible { outline: 2px solid var(--chrome-fg); outline-offset: 2px; }

  /* ---------- 新功能提示 ---------- */
  .notice { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 20; width: min(440px, calc(100% - 24px));
    display: flex; align-items: center; gap: 8px; background: var(--chrome); color: var(--chrome-fg); border: 1px solid var(--marigold); border-radius: 14px; padding: 10px 8px 10px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.25); font-size: 14px; }
  .notice span { flex: 1; }
  .notice #notice-go { border: 0; background: var(--marigold); color: var(--chrome); font-weight: 700; border-radius: 99px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .notice #notice-x { border: 0; background: transparent; color: var(--chrome-muted); font-size: 20px; width: 32px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .tour, .tour-hole, .tour-bubble { transition: none; }
    .stamp.land, .loading .dot { animation: none; }
    .toast { transition: none; }
  }

  /* ================= 開展隊平台的樣式 ================= */
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  select.inp, .inp { width: 100%; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 12px; padding: 11px 14px; font-size: 16px; min-height: 48px; color: var(--ink); font-family: var(--sans); }
  .inp:focus { outline: none; border-color: var(--ink); }
  select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .btn svg { vertical-align: -4px; margin-right: 2px; }
  .btn.small svg { width: 16px; height: 16px; vertical-align: -3px; }
  .panel { background: var(--paper); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .panel h2 { font-size: 17px; margin: 0 0 6px; }
  .sec-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin: 18px 0 10px; }
  .panel .sec-h:first-child, .pray-wall .sec-h:first-child { margin-top: 0; }
  .sec-h h2 { font-size: 17px; margin: 0; display: flex; align-items: baseline; gap: 6px; }
  .sec-h .btn.small { margin: 0; flex: none; }
  .sec-h p { margin: 2px 0 0; }
  .n { font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--sky-2); border-radius: 99px; padding: 0 8px; margin-left: 6px; }
  .hello { margin: 16px 0 14px; color: var(--ink-2); }
  .kicker { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--line); letter-spacing: .04em; }
  .link-btn { background: none; border: 0; padding: 4px 6px; font-size: 14px; color: var(--line); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .link-btn.danger { color: var(--stamp); }
  .leave { text-align: center; font-size: 13px; margin: 18px 0; }
  .leave a { color: var(--ink-2); }
  .empty p { margin: 4px 0; }
  .empty-cards { font-size: 14px; margin: 4px 0 10px; }
  .switch { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; font-size: 15px; }
  .switch input { width: 22px; height: 22px; accent-color: var(--line); }
  .tones { grid-template-columns: repeat(4, 1fr); }
  #team-form .btn.send, #ses-form .btn.send { margin-top: 6px; }

  /* ---------- 首頁：開展隊卡片 ---------- */
  .team-list { display: grid; gap: 12px; }
  .team-card { display: flex; text-align: left; width: 100%; padding: 0; border: 0; background: var(--paper); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; color: var(--ink); }
  .tc-band { width: 10px; flex: none; background: linear-gradient(var(--tc) 70%, var(--tn) 70%); }
  .tc-main { padding: 14px 16px; flex: 1; min-width: 0; }
  .tc-main > b { display: block; font-family: var(--serif); font-weight: 900; font-size: 18px; line-height: 1.4; }
  .tc-main > small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .tc-stats { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .tc-stats b { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-right: 3px; }

  /* ---------- 開展隊頁首與底部分頁 ---------- */
  .team-top { position: relative; margin: 0 -16px 14px; padding: calc(12px + env(safe-area-inset-top)) 56px 16px 16px; background: var(--chrome); color: var(--chrome-fg); border-bottom: 3px solid var(--marigold); }
  .team-top h1 { font-family: var(--serif); font-weight: 900; font-size: 21px; line-height: 1.35; margin: 4px 0 2px; }
  .team-top p { margin: 0; font-size: 13px; color: rgba(247, 241, 228, .78); }
  .team-top .help { position: absolute; right: 14px; top: calc(14px + env(safe-area-inset-top)); width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--marigold); background: transparent; color: var(--marigold); font-family: var(--serif); font-weight: 900; font-size: 18px; cursor: pointer; }
  .back.light { color: rgba(247, 241, 228, .8); padding: 2px 0; font-size: 14px; }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--paper); border-top: 1px solid var(--rule); box-shadow: 0 -4px 18px rgba(30, 40, 30, .08); padding-bottom: env(safe-area-inset-bottom); }
  .bn-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .bottom-nav button { background: none; border: 0; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; position: relative; }
  .bottom-nav button svg { width: 22px; height: 22px; }
  .bottom-nav button[aria-current="page"] { color: var(--line); font-weight: 700; }
  .bottom-nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--marigold); }
  body.has-nav #app { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  body.has-nav .toast, body.has-nav .notice { bottom: calc(80px + env(safe-area-inset-bottom)); }

  /* ---------- 時段列表 ---------- */
  .grp-h { font-size: 13px; color: var(--ink-2); margin: 16px 0 8px; font-weight: 700; letter-spacing: .04em; }
  .ses-list { display: grid; gap: 10px; }
  .ses-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--paper); border: 0; border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; color: var(--ink); }
  .ses-card .date { flex: none; width: 52px; text-align: center; border-right: 2px dashed var(--rule); padding-right: 12px; }
  .ses-card .date b { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.1; color: var(--line); }
  .ses-card .date small { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  .ses-card .info { flex: 1; min-width: 0; }
  .ses-card .info > b { display: block; font-size: 16px; }
  .ses-card .info > small { display: block; color: var(--ink-2); font-size: 13px; }
  .ses-card .go { color: var(--ink-2); font-size: 22px; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .state.s-on { background: var(--line); color: #fff; }
  .state.s-soon { background: var(--gold-soft); color: var(--gold-text); }
  .state.s-end { background: var(--sky-2); color: var(--ink-2); }
  .state.mine { background: rgba(44, 91, 71, .12); color: var(--line); font-weight: 700; }

  /* ---------- 一個時段 ---------- */
  .ses-head .ph-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ses-title { font-family: var(--serif); font-weight: 900; font-size: 22px; margin: 8px 0 2px !important; line-height: 1.35; }
  .ses-when { margin: 0; font-weight: 700; color: var(--line); }
  .ses-note { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); white-space: pre-wrap; }
  .ses-people { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); display: grid; gap: 2px; }
  .act-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .act-row .btn.small { margin: 0; }
  .join-box { background: var(--gold-soft); border: 1.5px dashed var(--marigold); border-radius: 16px; padding: 16px; text-align: center; }
  .join-box p { margin: 0 0 12px; }
  .counters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .counter { background: var(--sky); border-radius: 14px; padding: 10px 6px 8px; text-align: center; min-width: 0; }
  .c-top { display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; position: relative; }
  .c-x { position: absolute; right: -2px; top: -4px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); font-size: 18px; cursor: pointer; }
  .c-row { display: flex; align-items: center; justify-content: space-between; gap: 2px; margin: 6px 0 2px; }
  .c-btn { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .c-btn.plus { background: var(--line); border-color: var(--line); color: #fff; width: 44px; height: 44px; }
  .c-btn:active { transform: scale(.94); }
  .c-num { width: 100%; flex: 1; min-width: 0; text-align: center; font-family: var(--serif); font-weight: 900; font-size: 27px; border: 0; background: transparent; color: var(--ink); padding: 0; }
  .c-num:focus { outline: 2px solid var(--marigold); border-radius: 8px; }
  .counter small { color: var(--ink-2); font-size: 12px; }
  .add-items { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .add-items .chip { padding: 4px 10px; font-size: 13px; }
  .cnt-state { font-size: 12px; color: var(--gold-text); text-align: right; margin: 6px 0 0; min-height: 1.2em; }
  .cards-h { border-top: 1.5px dashed var(--rule); padding-top: 14px; margin-top: 14px; }
  .add-card { margin-top: 4px; border-style: dashed; }
  .shot-only { display: none; }
  .shooting .shot-only { display: block; }
  .shot-cap { font-size: 13px; color: var(--ink-2); margin: -4px 0 10px; }
  .shooting { padding: 16px !important; }

  /* ---------- 記名卡片 ---------- */
  .pcards { display: grid; gap: 12px; margin-bottom: 12px; }
  .pcard { background: var(--paper); border: 1.5px solid var(--rule); border-left: 5px solid var(--marigold); border-radius: 14px; padding: 12px 14px; }
  .pcard.urgent { border-color: rgba(176, 58, 46, .45); border-left-color: var(--stamp); background: linear-gradient(#FFF6F2, var(--paper) 60%); }
  .pcard.editing { border-left-color: var(--line); box-shadow: var(--shadow); }
  .pc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pc-name b { font-size: 18px; margin-right: 6px; }
  .urgent-mark { display: inline-flex; align-items: center; gap: 2px; color: var(--stamp); font-size: 12px; font-weight: 700; vertical-align: 2px; }
  .urgent-mark svg { width: 14px; height: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--sky-2); color: var(--ink); white-space: nowrap; }
  .tag.open-A { background: #DCEFE3; color: #1E6440; font-weight: 700; }
  .tag.open-B { background: #F5EBD3; color: #7A5A1E; font-weight: 700; }
  .tag.open-C { background: #ECEAE6; color: #6B6862; font-weight: 700; }
  .tag.gold { background: var(--gold-soft); color: var(--gold-text); font-weight: 700; }
  .tag.muted-tag { color: var(--ink-2); }
  .pc-flags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .flag { min-width: 40px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink-2); font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }

  .pc-info { display: grid; grid-template-columns: 4.2em 1fr; gap: 3px 8px; margin: 8px 0 0; font-size: 14px; }
  .pc-info dt { color: var(--ink-2); }

  .pc-photos { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  .pc-photos img { height: 96px; border-radius: 10px; }
  .pc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--sky-2); font-size: 12.5px; color: var(--ink-2); }
  .pc-edit-h { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; margin: 0 0 10px; }
  .pc-edit-h small { font-weight: 400; color: var(--ink-2); font-size: 12px; }
  .pcard .field { margin-bottom: 8px; }
  .pcard .field input, .pcard .field textarea { min-height: 46px; padding: 10px 12px; }
  .pcard .field textarea { min-height: 64px; }
  .pcard .btn-row { margin-top: 6px; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos .ph { position: relative; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; background: var(--rule); }
  .photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photos .ph button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
  .photos .ph.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--sky); border: 1.5px dashed var(--rule); color: var(--ink-2); font-size: 12px; cursor: pointer; }

  /* ---------- 一鍵複製、存圖 ---------- */
  .tools { display: flex; gap: 4px; flex: none; }
  .tool { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); border-radius: 8px; padding: 4px 7px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .tool svg { width: 15px; height: 15px; }
  .tool:active { background: var(--sky-2); }

let NAV = 0; // 每換一次畫面加 1；背景抓到新資料時，只在使用者還停在同一個畫面才重畫
const view = (html, keepScroll) => { NAV++; const y = scrollY; $app.innerHTML = html; window.scrollTo(0, keepScroll ? y : 0); };
const $ = id => document.getElementById(id);

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ================= 日期 ================= */
const WD = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const dayLabel = s => { const d = parseYmd(s); return d ? `${md(d)}（${WD[d.getDay()]}）` : ''; };
const periodLabel = (a, b) => a || b ? `${a ? dayLabel(a) : ''}～${b ? dayLabel(b) : ''}` : '';
const timeRange = s => s.start || s.end ? `${s.start || ''}${s.end ? '–' + s.end : ''}` : '';
/** 時段的標題：「11/20（四）14:00–16:00・一中街」 */
const sesLabel = s => [`${dayLabel(s.date)} ${timeRange(s)}`.trim(), s.place].filter(Boolean).join('・');
const sesName = s => s.title || s.place || '開展時段';
/** 時段狀態：還沒開始／進行中／已結束 */
function sesState(s) {
  const now = DEMO ? DEMO_NOW : new Date();
  const d = parseYmd(s.date); if (!d) return '';
  const at = t => { const m = /^(\d{2}):(\d{2})$/.exec(t || ''); const x = new Date(d); if (m) x.setHours(+m[1], +m[2]); return x; };
  const st = s.start ? at(s.start) : d, en = s.end ? at(s.end) : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59);
  if (now < st) return ymd(now) === s.date ? '今天' : '即將';
  if (now > en) return '已結束';
  return '進行中';
}

/* ================= 開展隊色調 ================= */
const THEMES = {

let LIFF_OK = DEMO;
const LIFF_READY = DEMO ? Promise.resolve() : new Promise((ok, bad) => {

/* ---------- 平台通行證：登入一次，60 天內不用再登入 ---------- */
const SESSION_KEY = 'outreach.session';
const getSession = () => { try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.expires > Date.now() + 60000 ? s : null; } catch (e) { return null; } };
const setSession = s => { try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify({ token: s.token, expires: s.expires })) : localStorage.removeItem(SESSION_KEY); } catch (e) {} };

const READS = new Set(['home', 'team', 'invite', 'myData']);
async function api(action, data = {}) {
  if (DEMO) { const r = await demoApi(action, data); if (!READS.has(action) && action !== 'uploadImage' && action !== 'saveCounts') clearCache(); return JSON.parse(JSON.stringify(r)); }
  const body = { action, ...data };
  const s = action === 'session' ? null : getSession();
  if (s) body.session = s.token; else { await LIFF_READY; body.idToken = liff.getIDToken(); }
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') {
      setSession(null); await LIFF_READY;
      if (liff.isLoggedIn()) return api(action, data);
      liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入');
    }
    if (j.error === 'TOKEN_EXPIRED') { await LIFF_READY; liff.logout(); liff.login({ redirectUri: location.href }); throw new Error('登入已過期，正在重新登入'); }
    throw new Error(j.error);
  }
  if (!READS.has(action) && action !== 'session' && action !== 'uploadImage' && action !== 'saveCounts') clearCache();
  return j;
}

/* ---------- 加速：先用上次的資料馬上顯示，背景再向後端拿最新的 ---------- */
const CACHE_KEY = 'outreach.cache.v1';
let CACHE = {};
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); const tk = (getSession() || {}).token || ''; CACHE = !DEMO && c.owner === tk.slice(0, 12) ? c.data || {} : {}; } catch (e) { CACHE = {}; }
let cacheTimer;
function saveCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try {
      const keys = Object.keys(CACHE); while (keys.length > 20) delete CACHE[keys.shift()];
      const str = JSON.stringify({ owner: ((getSession() || {}).token || '').slice(0, 12), data: CACHE });
      if (!DEMO && str.length < 3e6) localStorage.setItem(CACHE_KEY, str); else localStorage.removeItem(CACHE_KEY);
    } catch (e) {}
  }, 300);
}
function clearCache() { CACHE = {}; INFLIGHT.clear(); saveCache(); }
const INFLIGHT = new Map();
const ckey = (action, data) => action + ':' + JSON.stringify(data || {});
function apiCached(action, data = {}, onFresh) {
  const k = ckey(action, data), old = CACHE[k];
  let p = INFLIGHT.get(k);
  if (!p) {
    p = api(action, data).then(r => { CACHE[k] = r; saveCache(); return r; }).finally(() => INFLIGHT.delete(k));
    INFLIGHT.set(k, p);
  }
  if (old === undefined) return p;
  p.then(r => { if (onFresh && JSON.stringify(r) !== JSON.stringify(old)) onFresh(r); }).catch(() => {});
  return Promise.resolve(JSON.parse(JSON.stringify(old)));
}

/* ---------- 時間選擇：24 小時制或上午／下午（記住每個人的選擇） ---------- */
const TIME_KEY = 'outreach.time24';
let TIME24 = (() => { try { return localStorage.getItem(TIME_KEY) !== '0'; } catch (e) { return true; } })();
const MINUTES = Array.from({ length: 12 }, (_, i) => pad(i * 5));
function timePick(attr, val) {
  const m = /^(\d{2}):(\d{2})$/.exec(val || ''), h = m ? +m[1] : null, mi = m ? m[2] : '';
  const mins = mi && !MINUTES.includes(mi) ? [...MINUTES, mi].sort() : MINUTES;
  const opt = (v, l, on) => `<option value="${v}" ${on ? 'selected' : ''}>${l}</option>`;
  const minSel = `<select class="inp tp-m" aria-label="分">${opt('', '分', !m)}${mins.map(x => opt(x, x, x === mi)).join('')}</select>`;
  const hid = `<input type="hidden" ${attr} value="${esc(m ? val : '')}">`;
  if (TIME24) return `<span class="tpick" data-tp>${hid}<select class="inp tp-h" aria-label="時">${opt('', '時', h == null)}${Array.from({ length: 24 }, (_, i) => opt(pad(i), pad(i), h === i)).join('')}</select><b>:</b>${minSel}</span>`;
  const ap = h == null ? '' : h < 12 ? 'am' : 'pm', h12 = h == null ? null : (h % 12 || 12);
  return `<span class="tpick ampm" data-tp>${hid}<select class="inp tp-ap" aria-label="上午或下午">${opt('', '—', !ap)}${opt('am', '上午', ap === 'am')}${opt('pm', '下午', ap === 'pm')}</select>
    <select class="inp tp-h" aria-label="時">${opt('', '時', h12 == null)}${Array.from({ length: 12 }, (_, i) => opt(String(i + 1), String(i + 1), h12 === i + 1)).join('')}</select><b>:</b>${minSel}</span>`;
}
/** 選了時、分（上午／下午）之後，寫回隱藏的 HH:MM 欄位，並通知表單更新預覽 */
function syncTimePick(tp) {
  const h = tp.querySelector('.tp-h'), mi = tp.querySelector('.tp-m'), ap = tp.querySelector('.tp-ap'), hid = tp.querySelector('input[type=hidden]');
  let v = '';
  if (h.value !== '') {
    let hh = +h.value;
    if (ap) { if (!ap.value) ap.value = hh >= 7 && hh <= 11 ? 'am' : 'pm'; hh = (hh % 12) + (ap.value === 'pm' ? 12 : 0); }
    if (!mi.value) mi.value = '00';
    v = `${pad(hh)}:${mi.value}`;
  }
  hid.value = v;
  hid.dispatchEvent(new Event('change', { bubbles: true }));
}
const timeModeHtml = () => `<div class="time-mode"><span>時間顯示</span><div class="seg"><button type="button" data-act="timeMode" data-v="1" aria-selected="${TIME24}">24 小時制</button><button type="button" data-act="timeMode" data-v="0" aria-selected="${!TIME24}">上午／下午</button></div></div>`;

/* ---------- 批次建立：像設定鬧鐘一樣，可以有好幾組時間，每組可重複（每天／每週／自訂星期） ---------- */
const REPEATS = [['none', '不重複'], ['daily', '每天'], ['weekly', '每週'], ['custom', '自訂']];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // 週一～主日
const WD_NAME = d => d === 0 ? '主日' : '週' + WD[d];
let SLOTS = [], REPEAT = { mode: 'none', days: [], until: '' };
function defaultUntil(from) {
  const e = parseYmd(TEAM.team.end), d = parseYmd(from) || now();
  const four = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 27);
  return ymd(e && e > d ? e : four);
}
/** 依重複規則展開成實際的日期與時間（同一天同一個開始時間只算一次），最多 60 個 */
function expandSlots() {
  const out = [], seen = new Set(), until = parseYmd(REPEAT.until);
  SLOTS.forEach(sl => {
    const d0 = parseYmd(sl.date); if (!d0) return;
    const push = d => { const k = ymd(d) + sl.start; if (!seen.has(k)) { seen.add(k); out.push({ date: ymd(d), start: sl.start, end: sl.end }); } };
    if (REPEAT.mode === 'none' || !until || until < d0) { push(d0); return; }
    for (let d = new Date(d0), n = 0; d <= until && n < 400; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), n++) {
      const ok = REPEAT.mode === 'daily' || (REPEAT.mode === 'weekly' && d.getDay() === d0.getDay()) || (REPEAT.mode === 'custom' && REPEAT.days.includes(d.getDay()));
      if (ok) push(d);
    }
  });
  return out.sort((x, y) => (x.date + x.start).localeCompare(y.date + y.start));
}
function slotsHtml() {
  const list = expandSlots(), many = list.length > 60;
  return `${SLOTS.map((sl, i) => `<div class="slot" data-slot="${i}">
      <div class="slot-h"><b>${SLOTS.length > 1 ? `第 ${i + 1} 組時間` : '日期與時間'}</b>${i ? `<button type="button" class="link-btn danger" data-act="rmSlot" data-i="${i}">移除</button>` : ''}</div>
      <label class="field"><span>${REPEAT.mode === 'none' ? '日期' : '從哪一天開始'}</span><input type="date" data-sl="date" value="${esc(sl.date)}" required></label>
      <div class="row2"><div class="field"><span>開始</span>${timePick('data-sl="start"', sl.start)}</div><div class="field"><span>結束</span>${timePick('data-sl="end"', sl.end)}</div></div>
    </div>`).join('')}
    <button type="button" class="btn plain small add-slot-btn" data-act="addSlot">${ICON.plus} 再加一組時間</button>
    <div class="field repeat"><span>重複</span><div class="seg">${REPEATS.map(([k, l]) => `<button type="button" data-act="repeat" data-k="${k}" aria-selected="${REPEAT.mode === k}">${l}</button>`).join('')}</div>
      ${REPEAT.mode === 'custom' ? `<div class="wdays">${WEEK_ORDER.map(d => `<button type="button" class="wday" data-act="wday" data-d="${d}" aria-pressed="${REPEAT.days.includes(d)}">${d === 0 ? '日' : WD[d]}</button>`).join('')}</div>` : ''}
      ${REPEAT.mode === 'weekly' ? `<p class="help">每週${SLOTS.map(sl => { const d = parseYmd(sl.date); return d ? WD_NAME(d.getDay()).replace('週', '') : ''; }).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join('、')}（依每組的開始日期）</p>` : ''}

    <div class="slot-preview ${many ? 'warn' : ''}"><b>將建立 ${list.length} 個時段</b>${many ? '（一次最多 60 個，請縮短重複期間）' : ''}

}

      <label class="field"><span>備註（選填）</span><textarea name="note" maxlength="300" placeholder="集合地點、分組、要帶的東西…">${esc(s.note)}</textarea></label>
      <button class="btn send" type="submit">${isNew ? '建立時段' : '儲存'}</button>
    </form></div>`);
  const f = $('ses-form');
  if (isNew) {
    // 改了日期、時間：更新預覽（不重畫輸入框，才不會打斷輸入）
    $('slots').addEventListener('change', e => { if (e.target.matches('[data-sl], #rep-until')) { readSlots(); drawSlots(); } });
  }
  $$('[data-tpl]').forEach(b => b.onclick = () => {
    const t = TPLS[+b.dataset.tpl];
    ['title', 'place', 'note'].forEach(k => { f.elements[k].value = t[k] || ''; });
    readSlots(); SLOTS.forEach(sl => { sl.start = t.start || ''; sl.end = t.end || ''; }); drawSlots();
    $$('#ses-form [name=items]').forEach(i => { i.checked = t.items.includes(i.value); });
    $$('[data-tpl]').forEach(x => x.setAttribute('aria-pressed', x === b));
    toast('已帶入範本，日期請確認');
  });
  f.onsubmit = async e => {
    e.preventDefault();
    const v = n => f.elements[n].value.trim();
    const items = $$('#ses-form [name=items]:checked').map(x => x.value);
    if (!items.length) { toast('至少勾選一個計數項目'); return; }
    const removed = isNew ? [] : s.items.filter(k => !items.includes(k));
    if (removed.length && !await confirmBox({ title: `移除「${removed.map(k => ITEM[k].label).join('、')}」？`, text: '這個時段將不再記錄、統計這些項目。之後加回來，原本記的數字還在。', ok: '移除' })) return;
    const base = { title: v('title'), place: v('place'), items, note: v('note') };
    let slots = [];
    if (isNew) {
      readSlots(); slots = expandSlots();
      if (REPEAT.mode === 'custom' && !REPEAT.days.length) { toast('請勾選要重複的星期'); return; }
      if (!slots.length) { toast('請選擇日期'); return; }
      if (slots.length > 60) { toast('一次最多建立 60 個時段'); return; }
      if (slots.length > 1 && !await confirmBox({ title: `一次建立 ${slots.length} 個時段？`, text: `${dayLabel(slots[0].date)} ～ ${dayLabel(slots[slots.length - 1].date)}。之後每個時段都可以個別修改或刪除。`, ok: '建立', danger: false })) return;
    }
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = '建立中…';
    try {
      if (isNew) {
        const r = await api('createSessions', { teamId: TEAM.team.id, ses: base, slots });
        SUB = r.ids.length === 1 ? r.ids[0] : '';
        toast(r.ids.length === 1 ? '時段建立好了，可以邀請大家加入' : `已建立 ${r.ids.length} 個時段`);
      } else { await api('updateSession', { teamId: TEAM.team.id, sessionId: s.id, ses: { ...base, date: v('date'), start: v('start'), end: v('end') } }); toast('已儲存'); }
      TAB = 'rec'; await reloadTeam(false);
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = isNew ? '建立時段' : '儲存'; }
  };
}

async function uploadPhoto(inp) {
  const key = inp.dataset.photo, file = (inp.files || [])[0], d = EDIT[key];
  inp.value = '';
  if (!file || !d) return;
  const st = $(`ph-st-${key}`); if (st) st.textContent = '上傳中…';
  try {
    const dataUrl = await shrinkImage(file, 1200, 0.82);
    syncDrafts();
    d.photos = [...(d.photos || []), (await api('uploadImage', { data: dataUrl, mime: 'image/jpeg' })).url].slice(0, 3);
    rerenderCard(key);
  } catch (e) { if (st) st.textContent = ''; toast('上傳失敗：' + e.message); }
}
function shrinkImage(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('無法讀取這張圖片'));
    img.src = URL.createObjectURL(file);
  });
}

}

/** 名單排序：迫切的在前，再依敞開程度 A→B→C */
const sortCards = list => list.slice().sort((a, b) => (b.urgent - a.urgent) || ((a.open || 'Z').localeCompare(b.open || 'Z')));

/* ================= 累積彙整 ================= */
function renderAll() {
  const ss = sortSes(TEAM.sessions).filter(s => sesState(s) !== '即將' || s.parts.some(p => Object.keys(p.counts || {}).length));
  const used = ITEMS.map(x => x.k).filter(k => ss.some(s => s.items.includes(k)));
  const tot = k => ss.reduce((n, s) => n + (s.items.includes(k) ? sesTotal(s, k) : 0), 0);
  const people = {};
  ss.forEach(s => s.parts.forEach(p => {
    const r = people[p.userId] || (people[p.userId] = { label: esc(p.name), n: 0, v: {} });
    r.n++;
    s.items.forEach(k => { r.v[k] = (r.v[k] || 0) + countOf(s, p, k); });
  }));
  const all = sortCards(TEAM.cards);
  const filters = [['all', '全部', all.length], ['A', 'A 非常敞開', all.filter(c => c.open === 'A').length], ['B', 'B 普通', all.filter(c => c.open === 'B').length], ['C', 'C 較無興趣', all.filter(c => c.open === 'C').length], ['urgent', '迫切代禱', all.filter(c => c.urgent).length]];
  const shown = all.filter(c => LIST_FILTER === 'all' || (LIST_FILTER === 'urgent' ? c.urgent : c.open === LIST_FILTER));
  const t = TEAM.team;
  return `<section class="panel sum" id="sum-all">

      <div class="tiles">${used.map(k => `<div class="tile"><b>${tot(k)}</b><small>${ITEM[k].label}</small></div>`).join('') || '<p class="muted">還沒有紀錄。</p>'}</div>
      ${ss.length ? `<h3 class="tbl-h">各時段計數</h3>${countTable(ss.map(s => ({ label: `${esc(dayLabel(s.date))}<small>${esc(sesName(s))}</small>`, v: Object.fromEntries(used.map(k => [k, s.items.includes(k) ? sesTotal(s, k) : null])) })), used, '時段')}
      <h3 class="tbl-h">各隊員計數</h3>${countTable(Object.values(people).map(r => ({ label: `${r.label}<small>${r.n} 次</small>`, v: r.v })), used, '隊員')}` : ''}
    </section>
    <section class="panel sum" id="sum-list">
      <div class="sec-h"><h2>累積名單<span class="n">${all.length}</span></h2>${tools('list', 'sum-list', `${t.title}-累積名單`)}</div>
      <div class="chips no-shot">${filters.map(([k, l, n]) => `<button class="chip ${LIST_FILTER === k ? 'on' : ''}" type="button" data-act="listFilter" data-k="${k}">${l} ${n}</button>`).join('')}</div>
      ${LIST_FILTER !== 'all' ? `<p class="shot-only shot-cap">篩選：${filters.find(f => f[0] === LIST_FILTER)[1]}</p>` : ''}

}

/* ================= 一鍵複製的文字 ================= */
const line = '────────';
function cardText(c, withSes = true) {

  if (c.phone) L.push(`手機：${c.phone}`);
  if (c.lineId) L.push(`LINE ID：${c.lineId}`);
  if (c.address) L.push(`地址：${c.address}`);
  const fl = FLAGS.filter(f => c[f.k]).map(f => f.label); if (fl.length) L.push(`狀態：${fl.join('、')}`);
  if (c.note) L.push(`備註：${c.note}`);
  L.push(`開展者：${c.owner}${withSes && s.date ? `（${dayLabel(s.date)} ${s.place || ''}）`.replace(' ）', '）') : ''}`);

}
const countLine = (s, get) => s.items.map(k => `${ITEM[k].label} ${get(k)}`).join('｜');
const cardBrief = (c, i) => `${i + 1}. ${c.name || '（未填姓名）'}${c.urgent ? '★' : ''}（${[c.gender, c.age, c.open].filter(Boolean).join('／') || '—'}）${c.owner}`;

  card: id => cardText(TEAM.cards.find(c => c.id === id)),

  rec: id => {

    return [`【時段彙整】${sesName(s)}`, sesLabel(s), `參加 ${s.parts.length} 人`, `合計：${countLine(s, k => sesTotal(s, k))}`, line,
      ...s.parts.map(p => `${p.name}：${countLine(s, k => countOf(s, p, k))}`), line, `名單（${cards.length}）：`, ...cards.map(cardBrief)].join('\n');
  },
  all: () => {
    const ss = sortSes(TEAM.sessions).filter(s => sesState(s) !== '即將' || s.parts.some(p => Object.keys(p.counts || {}).length));
    const used = ITEMS.filter(x => ss.some(s => s.items.includes(x.k)));
    return [`【累積彙整】${TEAM.team.title}`, `${ss.length} 個時段`, used.map(x => `${x.label} ${ss.reduce((n, s) => n + (s.items.includes(x.k) ? sesTotal(s, x.k) : 0), 0)}`).join('｜'), line,

    <p class="adm-who">${ADM.isAdmin ? '你是<b>平台管理員</b>，可以管理所有開展隊。' : '這裡列出你建立的開展隊，可以修改、開放／關閉加入、刪除。'}</p>
    <section class="panel" id="adm-sum">
      <div class="sec-h"><h2>總覽</h2>${tools('admin', 'adm-sum', '後台總覽')}</div>
      <div class="tiles"><div class="tile"><b>${shown.length}</b><small>開展隊</small></div><div class="tile"><b>${sum('memberCount')}</b><small>隊員</small></div><div class="tile"><b>${sum('sessionCount')}</b><small>時段</small></div>
        <div class="tile"><b>${sum('partCount')}</b><small>參與人次</small></div><div class="tile"><b>${sum('cardCount')}</b><small>名單</small></div><div class="tile"><b>${shown.filter(t => t.open).length}</b><small>開放加入</small></div></div>
    </section>
    <div class="adm-bar no-shot">
      <input class="inp" id="adm-q" type="search" placeholder="搜尋開展隊名稱、建立者" value="${esc(ADM_Q)}">
      ${ADM.isAdmin ? `<div class="seg" role="tablist"><button type="button" data-act="admScope" data-k="all" aria-selected="${ADM_SCOPE === 'all'}">全部 ${ADM.teams.length}</button><button type="button" data-act="admScope" data-k="mine" aria-selected="${ADM_SCOPE === 'mine'}">我建立的 ${ADM.teams.filter(t => t.mine).length}</button></div>` : ''}
    </div>
    <div class="adm-head no-shot"><label class="check-inline"><input type="checkbox" id="adm-all" ${allOn ? 'checked' : ''}><span>全選</span></label><span class="muted small">${shown.length} 個開展隊</span></div>
    <div class="adm-list">${shown.map(admRow).join('') || `<div class="empty"><p>${ADM_Q ? '找不到符合的開展隊。' : '還沒有建立任何開展隊。'}</p></div>`}</div>
    ${ADM_SEL.size ? `<div class="adm-dock no-shot"><div class="inner"><span><b>${ADM_SEL.size}</b> 個已選</span>
      <button class="btn plain small" type="button" data-act="admBulkOpen" data-v="1">開放加入</button><button class="btn plain small" type="button" data-act="admBulkOpen" data-v="0">關閉加入</button>
      <button class="btn danger-fill small" type="button" data-act="admBulkDel">刪除</button></div></div>` : ''}`, keep);
  const q = $('adm-q');
  q.oninput = () => { ADM_Q = q.value; const pos = q.selectionStart; renderAdmin(true); const n = $('adm-q'); n.focus(); n.setSelectionRange(pos, pos); };
  $('adm-all').onchange = e => { shown.forEach(t => e.target.checked ? ADM_SEL.add(t.id) : ADM_SEL.delete(t.id)); renderAdmin(true); };
}
function admRow(t) {
  const th = themeOf(t);
  return `<article class="adm-row ${ADM_SEL.has(t.id) ? 'sel' : ''}" style="--tc:${th.btn};--tn:${th.notch}">
    <label class="adm-check no-shot" aria-label="選取 ${esc(t.title)}"><input type="checkbox" data-adm-sel="${esc(t.id)}" ${ADM_SEL.has(t.id) ? 'checked' : ''}></label>
    <div class="adm-main">
      <div class="adm-t">${teamIcon(t, 'adm-img')}<b>${esc(t.title)}</b><span class="state ${t.open ? 's-on' : 's-end'}">${t.open ? '開放加入' : '不開放'}</span></div>
      <p class="muted small">${esc(periodLabel(t.start, t.end) || '未設定期間')}・建立者 ${esc(t.owner)}${t.mine ? '（我）' : ''}・${esc(t.created)} 建立</p>
      <p class="adm-stats"><span><b>${t.memberCount}</b>隊員</span><span><b>${t.sessionCount}</b>時段</span><span><b>${t.partCount || 0}</b>人次</span><span><b>${t.cardCount}</b>名單</span>${t.lastDate ? `<span class="muted small">最近 ${esc(dayLabel(t.lastDate))}</span>` : ''}</p>
      <div class="adm-acts no-shot">
        <button class="btn send small" type="button" data-act="admOpenTeam" data-id="${esc(t.id)}">進入</button>
        <button class="btn plain small" type="button" data-act="admEdit" data-id="${esc(t.id)}">修改</button>
        <button class="btn plain small" type="button" data-act="admToggle" data-id="${esc(t.id)}">${t.open ? '關閉加入' : '開放加入'}</button>
        <button class="btn cancel small" type="button" data-act="admDel" data-id="${esc(t.id)}">刪除</button>
      </div></div></article>`;
}
function renderAdminEdit(t) {
  if (!t) { ADM_EDIT = ''; return renderAdmin(); }
  view(`${subbar('後台管理', '修改開展隊', 'admBack')}${teamForm(t, false)}<p class="caption">建立者：${esc(t.owner)}・隊員 ${t.memberCount} 人</p>`);
  bindTeamForm(async team => {
    await api('adminUpdate', { teamId: t.id, team });
    ADM_EDIT = ''; HOME = null; toast('已儲存');
    const r = await api('adminTeams'); ADM = r; renderAdmin();
  });
}
async function admDelete(ids) {
  const list = ADM.teams.filter(t => ids.includes(t.id));
  const cards = list.reduce((n, t) => n + t.cardCount, 0), ses = list.reduce((n, t) => n + t.sessionCount, 0);
  const title = list.length === 1 ? `刪除「${list[0].title}」？` : `刪除選取的 ${list.length} 個開展隊？`;
  if (!await confirmBox({ title, text: `${list.length > 1 ? list.map(t => `「${t.title}」`).join('、') + '。' : ''}會一併刪除 ${ses} 個時段、所有計數和 ${cards} 張記名卡片，隊員也看不到了，無法復原。`, ok: '刪除' })) return;
  const r = await api('adminDelete', { teamIds: ids });
  ids.forEach(id => ADM_SEL.delete(id)); ADM = r; HOME = null; TEAM = null;
  toast(`已刪除 ${list.length} 個開展隊`); renderAdmin(true);
}
async function admSetOpen(ids, open) {
  const r = await api('adminSetOpen', { teamIds: ids, open });
  ADM = r; HOME = null; toast(open ? '已開放加入' : '已關閉加入'); renderAdmin(true);
}
Object.assign(ACTS, {
  admin: () => { ADM = null; adminFlow(); },
  admBack: () => { ADM_EDIT = ''; renderAdmin(); },
  admScope: b => { ADM_SCOPE = b.dataset.k; renderAdmin(true); },
  admOpenTeam: b => teamFlow(b.dataset.id, 'rec', ''),
  admEdit: b => { ADM_EDIT = b.dataset.id; renderAdmin(); },
  admToggle: b => { const t = ADM.teams.find(x => x.id === b.dataset.id); return admSetOpen([t.id], !t.open); },
  admDel: b => admDelete([b.dataset.id]),
  admBulkDel: () => admDelete([...ADM_SEL]),
  admBulkOpen: b => admSetOpen([...ADM_SEL], b.dataset.v === '1'),
});
document.addEventListener('change', e => { const id = e.target.dataset && e.target.dataset.admSel; if (id) { e.target.checked ? ADM_SEL.add(id) : ADM_SEL.delete(id); renderAdmin(true); } });
COPY.admin = () => { const l = admShown(); return [`【開展隊後台】${l.length} 個開展隊`, ...l.map((t, i) => `${i + 1}. ${t.title}（${t.open ? '開放加入' : '不開放'}）建立者 ${t.owner}・隊員 ${t.memberCount}・時段 ${t.sessionCount}・名單 ${t.cardCount}`)].join('\n'); };
main();
</script>
</body>
</html>
